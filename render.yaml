# Render — déploiement split (2 services)
# Backend API : https://algeria-travel-7i7y.onrender.com
# Frontend     : https://algeria-travel-1.onrender.com

services:
  # ── Backend Node (API + admin optionnel) ──
  - type: web
    name: algeria-travel-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate:render
    startCommand: npm start
    healthCheckPath: /api/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: false
      - key: SERVE_ADMIN
        value: true
      - key: FRONTEND_URL
        value: https://algeria-travel-1.onrender.com
      - key: SITE_URL
        value: https://algeria-travel-1.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: algeria-travel
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:Algeria.travel@gmail.com

  # ── Frontend React (Static Site) ──
  - type: web
    name: algeria-travel-front
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://algeria-travel-7i7y.onrender.com
      - key: REACT_APP_SITE_URL
        value: https://algeria-travel-1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
