# Render — 1 service Web Node (PAS de Static Site, PAS de "Publish Directory")
# Le chat et l'API nécessitent : startCommand npm start → backend/server.js
# Dashboard Render : supprimer "Publish Directory" si défini sur build/

services:
  - type: web
    name: algeria-travel
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:render && npm run migrate:render
    startCommand: npm start
    healthCheckPath: /api/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: true
      - key: SERVE_ADMIN
        value: true
      - key: REACT_APP_API_URL
        value: ""
      - key: SITE_URL
        fromService:
          type: web
          name: algeria-travel
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: algeria-travel
          property: host
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: algeria-travel
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:Algeria.travel@gmail.com
